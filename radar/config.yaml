# Trendy Trend Radar — ingest configuration
# Official TikTok/Instagram APIs are limited / ToS-sensitive; stubs stay off until keys exist.

schedule_hint: "daily (GitHub Actions cron, 06:00 UTC)"
user_agent: "TrendyRadar/0.1 (+https://github.com/bluenightlightpup/trendy; polite research bot)"

rate_limits:
  default_requests_per_minute: 10
  reddit_min_interval_seconds: 2

paths:
  trends: web/data/trends.json
  slang: web/data/slang.json
  last_run: radar/out/last-run.json
  raw_dir: radar/out/raw

sources:
  mock_seed:
    enabled: true
    mode: seed  # built-in evergreen list; keeps the catalog warm when live sources fail
  reddit:
    enabled: true
    mode: live  # public JSON; currently HTTP 403 from GitHub Actions runners (see docs/radar.md)
    subreddits:
      - OutOfTheLoop
      - explainlikeimfive
      - NoStupidQuestions
      - tiktokcringe
      - internet_culture
      - gaming
      - college
      - sports
      - kpophelp
      - personalfinance
    listing: hot
    limit: 25
  wikipedia_current:
    # Portal:Current_events is news, not slang — it polluted trends.json. Off by default.
    enabled: false
    mode: live
  youtube:
    # Science/engineering channel uploads are not slang trends. Off by default; when
    # enabled, only videos whose title mentions one of require_keywords are kept.
    enabled: false
    mode: live  # public channel Atom feeds (no API key)
    require_keywords: [slang, meme, memes, trend, trending, tiktok, brainrot, rizz, "gen z", "gen alpha", viral]
    feeds:
      - "https://www.youtube.com/feeds/videos.xml?channel_id=UCHnyfMqiRRG1u-2MsSQLbXA"
      - "https://www.youtube.com/feeds/videos.xml?channel_id=UCY1kMZp36IQSyNx_9h4mpCg"
  tiktok:
    enabled: false
    mode: stub
    notes: "Needs TikTok Research API / partner feed + owner keys"
  instagram:
    enabled: false
    mode: stub
    notes: "Needs Meta Graph / official partner access + owner keys"

slang_heuristics:
  min_token_len: 2
  max_token_len: 24
  max_new_per_run: 80

# Catalog size caps (Explore should feel vast; raise if Radar trims too hard)
merge:
  max_trends: 250
  max_slang_entries: 500
  # Rows from these sources are purged from trends.json on every run.
  drop_sources: [youtube, wikipedia]
