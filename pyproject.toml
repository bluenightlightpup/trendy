[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trendy-cli"
version = "0.1.0"
description = "Slang, abbreviation and meme-trend decoder: a zero-dependency CLI and read-only MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "web/data/ABBREVE-LICENSE"]
authors = [{ name = "bluenightlightpup" }]
keywords = ["slang", "mcp", "mcp-server", "cli", "memes", "gen-z", "gen-alpha", "abbreviations", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bluenightlightpup/trendy"
Source = "https://github.com/bluenightlightpup/trendy"
Issues = "https://github.com/bluenightlightpup/trendy/issues"

[project.scripts]
trendy = "trendy_cli.trendy:main"
trendy-mcp = "trendy_cli.mcp_server:main"
# Same as `trendy`; lets `uvx trendy-cli mcp` work without --from.
trendy-cli = "trendy_cli.trendy:main"

# The source package lives in cli/ and installs as trendy_cli (the bare name
# "trendy" is taken on PyPI and too generic as an import name).
[tool.hatch.build.targets.wheel]
packages = ["cli"]
exclude = ["cli/test_*.py", "cli/__pycache__"]

[tool.hatch.build.targets.wheel.sources]
"cli" = "trendy_cli"

# Bundle the read-only catalog so an installed CLI / MCP server works anywhere.
[tool.hatch.build.targets.wheel.force-include]
"web/data/slang.json" = "trendy_cli/data/slang.json"
"web/data/abbreve.json" = "trendy_cli/data/abbreve.json"
"web/data/trends.json" = "trendy_cli/data/trends.json"
"web/data/community-slang.json" = "trendy_cli/data/community-slang.json"
"web/data/ABBREVE-LICENSE" = "trendy_cli/data/ABBREVE-LICENSE"
"radar/out/last-run.json" = "trendy_cli/data/last-run.json"

[tool.hatch.build.targets.sdist]
include = [
  "cli/*.py",
  "web/data/slang.json",
  "web/data/abbreve.json",
  "web/data/trends.json",
  "web/data/community-slang.json",
  "web/data/ABBREVE-LICENSE",
  "radar/out/last-run.json",
  "README.md",
  "LICENSE",
  "NOTICE",
  "server.json",
]
