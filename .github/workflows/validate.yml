name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  required-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required paths exist
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CONTRIBUTING.md
            SECURITY.md
            CODEOWNERS
            CLAUDE.md
            AGENTS.md
            docs/prd.md
            docs/phased-implementation.md
            docs/backlog.md
            docs/architecture.md
            docs/design-tokens.md
            docs/workbench.md
            docs/xcode-setup.md
            App/TrendyApp.swift
            App/ContentView.swift
          )
          for f in "${required[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "Missing required path: $f"
              exit 1
            fi
            echo "ok $f"
          done

      - name: LICENSE looks like MIT
        run: |
          set -euo pipefail
          grep -qi 'MIT License' LICENSE
          grep -q 'Copyright (c) 2026 bluenightlightpup' LICENSE
          grep -qi 'Permission is hereby granted' LICENSE
          echo "LICENSE MIT check passed"

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Radar deps (radar tests only; the CLI is stdlib)
        run: pip install -r radar/requirements.txt

      - name: CLI + MCP + proxy tests
        run: python -m unittest discover -s cli -t . -v

      - name: Radar tests
        run: python -m unittest discover -s radar -t . -p "test_*.py" -v

      - name: Validate JSON data
        run: |
          for f in web/data/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done

  node-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PWA unit tests
        working-directory: web
        run: npm test
