name: Trendy
options:
  bundleIdPrefix: com.bluenightlightpup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1"

targets:
  Trendy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluenightlightpup.trendy
        PRODUCT_NAME: Trendy
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Trendy
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - TrendyTests

  TrendyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TrendyTests
    dependencies:
      - target: Trendy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bluenightlightpup.trendy.tests
